<style>
body{margin:0;background:#F7F0E6;color:#49382E;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#49382E;text-decoration:none}a:hover{color:#8C6935}

.nav-links{display:flex;gap:40px}
.ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}.ln>span{display:block;transform:translateY(112%);transition:transform 1.2s cubic-bezier(.19,1,.22,1)}

.clip{clip-path:inset(100% 0 0 0);transition:clip-path 1.4s cubic-bezier(.77,0,.18,1)}
.clipl{clip-path:inset(0 100% 0 0);transition:clip-path 1.4s cubic-bezier(.77,0,.18,1)}
.in .clip,.clip.in,.in .clipl,.clipl.in{clip-path:inset(0 0 0 0)}
.imgw{overflow:hidden;position:relative;background:#E7D7C5}.imgw img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.14);transition:transform 1.8s cubic-bezier(.22,1,.36,1)}

.plxw{position:relative;overflow:hidden}.plxw img{position:absolute;left:0;top:-15%;width:100%;height:130%;object-fit:cover;will-change:transform}
.ul{position:relative;display:inline-block}.ul::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:100%;background:#B99552;transform:scaleX(0);transform-origin:right;transition:transform .55s cubic-bezier(.22,1,.36,1)}.ul:hover::after{transform:scaleX(1);transform-origin:left}
.btn{display:inline-flex;align-items:center;gap:14px;border:1px solid #B99552;padding:18px 28px;border-radius:2px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;position:relative;overflow:hidden;transition:color .5s;color:#49382E;background:transparent}

.btn:hover::before{transform:none}.btn:hover{color:#FFF9F0}.btn>*{position:relative}
.btn svg{transition:transform .5s cubic-bezier(.22,1,.36,1)}.btn:hover svg{transform:translateX(6px)}
.btn.solid{background:#B99552;color:#FFF9F0}.btn.solid::before{background:#8C6935}
.spark{position:absolute;width:6px;height:6px;background:#DCC394;border-radius:50%;animation:tw 3.2s ease-in-out infinite;box-shadow:0 0 12px 2px rgba(220,195,148,.9)}
.spin{animation:spin 26s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.orn{width:1px;height:72px;background:linear-gradient(#B99552,transparent)}
.list a{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:22px 0;border-bottom:1px solid #CDB99E;position:relative;transition:padding-left .5s cubic-bezier(.22,1,.36,1)}
.list a::before{content:"";position:absolute;left:0;top:0;height:100%;width:2px;background:#B99552;transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.list a:hover{padding-left:20px}.list a:hover::before{transform:none}
/* team intro */
.rule{flex:1 1 auto;height:1px;background:#49382E;transform:scaleX(0);transform-origin:left;transition:transform 1.5s cubic-bezier(.22,1,.36,1) .45s}
.in .rule{transform:none}
.wl,.wr{opacity:0;transition:opacity 1s ease .3s,transform 1.2s cubic-bezier(.22,1,.36,1) .3s}
.wl{transform:translateX(-28px)}.wr{transform:translateX(28px)}
.in .wl,.in .wr{opacity:1;transform:none}
/* services grid */

.card{position:relative;display:flex;flex-direction:column;background:#FFF9F0;border:1px solid #E7D7C5;border-radius:18px;overflow:hidden;color:#49382E;transition:transform .6s cubic-bezier(.22,1,.36,1),box-shadow .6s ease,border-color .6s}

.card:hover .pic img{transform:scale(1.08)}
.card .pic::after{content:"";position:absolute;inset:14px;border:1px solid rgba(220,195,148,.95);border-radius:10px;opacity:0;transform:scale(.97);transition:opacity .7s ease,transform .9s cubic-bezier(.22,1,.36,1);pointer-events:none}
.card:hover .pic::after{opacity:1;transform:none}
.card .pic .n{position:absolute;left:18px;top:18px;background:rgba(255,249,240,.94);color:#8C6935;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:18px;line-height:1;padding:8px 13px;border-radius:999px;letter-spacing:.06em}
.card .bd{padding:26px 28px 28px;display:flex;flex-direction:column;gap:10px;flex:1 1 auto}
.card h3{margin:0;font-size:28px;letter-spacing:-.03em;font-weight:400;line-height:1.05}
.card .tg{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:23px;color:#8C6935;line-height:1.1}
.card p{margin:0;font-size:15px;line-height:1.5;color:#897465}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8C6935;border:1px solid #DCC394;border-radius:999px;padding:7px 12px;background:#FFFFFF;transition:background .4s,color .4s}
.card:hover .chips span{background:#F7F0E6}
.card .more{margin-top:auto;padding-top:18px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;color:#49382E}
.card .more svg{transition:transform .5s cubic-bezier(.22,1,.36,1)}.card:hover .more svg{transform:translateX(6px)}
.card.feat{grid-column:span 2}.card.feat .pic{height:320px}.card.feat h3{font-size:36px}
.card.cta{background:linear-gradient(160deg,#B99552 0%,#CDB06A 55%,#DCC394 100%);border-color:#B99552;color:#FFF9F0;justify-content:center;padding:36px 32px;gap:14px}
